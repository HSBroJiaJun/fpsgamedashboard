<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>熱門FPS遊戲數據</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- Apache ECharts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <!-- 外部 CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <div class="header">
        <h1>熱門FPS遊戲數據</h1>
        <p>Data Visualization Storytelling Dashboard</p>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- 左側遊戲列表 -->
        <div class="sidebar">
            <h2>選擇遊戲</h2>
            <div class="game-item active" data-game="valorant">
                <div class="game-content">
                    <img src="image/valo.png" alt="Valorant" class="game-logo">
                    <span class="game-name">Valorant</span>
                </div>
            </div>
            <div class="game-item" data-game="cs2">
                <div class="game-content">
                    <img src="image/CS2 (2).png" alt="Counter-Strike 2" class="game-logo">
                    <span class="game-name">Counter-Strike 2</span>
                </div>
            </div>
            <div class="game-item" data-game="apex">
                <div class="game-content">
                    <img src="image/apex.png" alt="Apex Legends" class="game-logo">
                    <span class="game-name">Apex Legends</span>
                </div>
            </div>
            <div class="game-item" data-game="overwatch2">
                <div class="game-content">
                    <img src="image/ow.png" alt="Overwatch 2" class="game-logo">
                    <span class="game-name">Overwatch 2</span>
                </div>
            </div>
            <div class="game-item" data-game="fortnite">
                <div class="game-content">
                    <img src="image/fornite.png" alt="Fortnite" class="game-logo">
                    <span class="game-name">Fortnite</span>
                </div>
            </div>
        </div>

        <!-- 右側圖表區域 -->
        <div class="charts-area">
            <!-- 圖表1: 排位分布柱狀圖 -->
            <div class="chart-container">
                <h3>排位分布(上一季)</h3>
                <div id="rankChart" class="chart"></div>
            </div>

            <!-- 圖表2: 當前玩家人數儀表盤 -->
            <div class="chart-container">
                <h3>當前遊玩玩家人數</h3>
                <div id="playerChart" class="chart"></div>
            </div>

            <!-- 圖表3: 年度遊玩人數折線圖 -->
            <div class="chart-container">
                <h3>年度遊玩人數趨勢</h3>
                <div id="trendChart" class="chart"></div>
            </div>
        </div>
    </div>

    <!-- 外部 JavaScript -->
    <script src="script.js"></script>

</body>
</html>
